name: CI
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.15', cache: pip, cache-dependency-path: backend/requirements.txt }
      - run: pip install -r backend/requirements.txt ruff
      - run: ruff check .
        working-directory: backend
      - run: python manage.py makemigrations --check --dry-run && python manage.py test zones
        working-directory: backend
        env: { DEBUG: 'true' }
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci && npm test && npx ng build
        working-directory: frontend
