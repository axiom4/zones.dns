# DNS over TLS (RFC 7858) for the DNS daemon: nginx terminates TLS on port 853 and passes the DNS-over-TCP stream on (same framing).
# Announced to clients with DNS_DDR=dot:dns.example.lan (RFC 9462). Needs nginx built with the stream module (nginx -V | grep stream).
#
#   sudo cp deploy/nginx/dns-dot.conf /etc/nginx/dns-dot.conf
#   add at the END of /etc/nginx/nginx.conf (top level, outside http { }):   include /etc/nginx/dns-dot.conf;
#   edit the two ssl_* paths (the certificate must cover the host name in DNS_DDR), then: sudo nginx -t && sudo systemctl reload nginx
#   open TCP 853 in the firewall for your clients only: there is no login on DNS.
stream {
    server {
        listen 853 ssl;
        listen [::]:853 ssl;
        allow 192.168.0.0/16;             # edit: the clients that may use the resolver
        deny all;
        ssl_certificate     /etc/ssl/certs/dns.example.lan.pem;
        ssl_certificate_key /etc/ssl/private/dns.example.lan.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        proxy_pass 127.0.0.1:5353;        # the daemon's --address/--port (TCP)
        proxy_timeout 30s;
    }
}
