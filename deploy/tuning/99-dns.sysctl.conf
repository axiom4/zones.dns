# Zones.dns: kernel settings for a DNS / DHCP / proxy server (4 core, 8 GB host).
#   sudo cp deploy/tuning/99-dns.sysctl.conf /etc/sysctl.d/99-dns.conf && sudo sysctl --system
net.core.rmem_max = 8388608           # UDP receive buffer of the DNS daemon under a burst of queries
net.core.wmem_max = 8388608
net.core.netdev_max_backlog = 4096    # packets queued between the driver and the stack
net.ipv4.tcp_max_syn_backlog = 4096
net.core.somaxconn = 4096
net.ipv4.ip_local_port_range = 10240 65535   # many short upstream connections (DNS, proxy)
net.ipv4.tcp_fin_timeout = 30
vm.swappiness = 20                    # with zram swap: use it only under real pressure
