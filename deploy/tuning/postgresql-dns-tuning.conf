# Zones.dns: PostgreSQL for a 4 core / 8 GB host with the database on an SD card; the hot data is small (about 1.4 GB),
# the daemons open many short connections. Scale the memory values to your RAM.
#   sudo cp deploy/tuning/postgresql-dns-tuning.conf /etc/postgresql/<version>/main/conf.d/dns-tuning.conf
#   sudo systemctl restart postgresql        (shared_buffers needs a restart)
shared_buffers = 1GB                  # about 12% of 8 GB; up to 25% on a host that does nothing else
effective_cache_size = 4GB            # what the system cache will hold: about half of the RAM
work_mem = 8MB
maintenance_work_mem = 256MB
wal_buffers = 16MB
wal_compression = on                  # fewer bytes written (SD card, small disks)
max_wal_size = 4GB                    # fewer, calmer checkpoints
min_wal_size = 512MB
checkpoint_timeout = 15min
checkpoint_completion_target = 0.9
random_page_cost = 2.0                # 1.1 on an SSD
log_min_duration_statement = 1000     # statements slower than 1 s go to the log
# max_connections (default 100) must cover DNS_WORKERS x 2 + the gunicorn threads + rundhcp + runproxy + a few: about 60 with 16 and 16.
