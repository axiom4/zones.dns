<div class="mapwrap">
<svg [attr.viewBox]="viewBox()" role="img" [attr.aria-label]="label()" [class.zoomed]="zoomed()"
  (wheel)="wheel($event)" (pointerdown)="down($event)" (pointermove)="move($event)" (pointerup)="up()" (pointerleave)="up()">
  <rect class="sea" [attr.width]="W" [attr.height]="H" rx="10" />
  @for (s of shapes(); track s.id) {
    <path class="land" [class.has]="s.queries > 0" [attr.d]="s.d" [style.fill]="s.fill" (click)="click(s.code, s.queries)">
      <title>{{ s.title }}</title>
    </path>
  }
  @for (p of dots(); track p.key) {
    <circle class="dot" [attr.cx]="p.x" [attr.cy]="p.y" [attr.r]="p.r"><title>{{ p.title }}</title></circle>
  }
</svg>
<div class="zoombar">
  <button type="button" class="mini" (click)="zoom(1.5)" aria-label="Zoom in">+</button>
  <button type="button" class="mini" (click)="zoom(1 / 1.5)" aria-label="Zoom out" [disabled]="!zoomed()">−</button>
  @if (zoomed()) { <button type="button" class="mini" (click)="reset()" aria-label="Reset zoom">⟲</button> }
</div>
@if (hint()) { <p class="maphint" aria-hidden="true">Hold Ctrl (⌘ on a Mac) and scroll to zoom the map</p> }
@if (failed()) {
  <div class="mapfail"><p>The map could not be loaded.</p><button type="button" class="ghost" (click)="fetchWorld()">Try again</button></div>
} @else if (!ready()) { <p class="mapfail soft">Loading the map…</p> }
</div>
@if (scale()) {
  <div class="shades" aria-hidden="true">
    <span>1 query</span><i class="ramp"></i><span>{{ scale() | number }} queries</span><span class="soft">(log scale)</span>
    @if (points().length) { <span class="citydot"><i></i> city, sized by queries</span> }
  </div>
}
