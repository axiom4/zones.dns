components:
  schemas:
    ActionEnum:
      enum:
      - delete
      - enable
      - disable
      type: string
      description: |-
        * `delete` - delete
        * `enable` - enable
        * `disable` - disable
    AdminTicket:
      type: object
      properties:
        ticket:
          type: string
          description: One-use ticket (60 s) for POST /admin/sso/
      required:
      - ticket
    Answer:
      type: object
      properties:
        name:
          type: string
        type:
          type: string
        value:
          type: string
        ttl:
          type: integer
      required:
      - name
      - ttl
      - type
      - value
    AuditReport:
      type: object
      properties:
        domain:
          type: string
        checked_at:
          type: string
          format: date-time
        deep:
          type: boolean
        duration_ms:
          type: integer
        summary:
          $ref: '#/components/schemas/AuditSummary'
        findings:
          type: array
          items:
            $ref: '#/components/schemas/Finding'
        dns:
          type: array
          items:
            $ref: '#/components/schemas/DnsRecords'
        soa:
          allOf:
          - $ref: '#/components/schemas/Soa'
          nullable: true
        nameservers:
          type: array
          items:
            $ref: '#/components/schemas/Nameserver'
        dnssec:
          $ref: '#/components/schemas/Dnssec'
        wildcard:
          type: boolean
        mail:
          $ref: '#/components/schemas/Mail'
        registration:
          allOf:
          - $ref: '#/components/schemas/Registration'
          nullable: true
        hosts:
          type: array
          items:
            $ref: '#/components/schemas/Host'
        tls:
          allOf:
          - $ref: '#/components/schemas/Tls'
          nullable: true
        web:
          $ref: '#/components/schemas/Web'
        services:
          type: array
          items:
            $ref: '#/components/schemas/Service'
        subdomains:
          allOf:
          - $ref: '#/components/schemas/Subdomains'
          nullable: true
      required:
      - checked_at
      - deep
      - dns
      - dnssec
      - domain
      - duration_ms
      - findings
      - hosts
      - mail
      - nameservers
      - registration
      - services
      - soa
      - subdomains
      - summary
      - tls
      - web
      - wildcard
    AuditRequestRequest:
      type: object
      properties:
        domain:
          type: string
          minLength: 1
          description: Domain or host name, e.g. example.com or www.example.com
        deep:
          type: boolean
          default: false
          description: 'Slower, more thorough: TLS protocol probing, exact SPF lookup
            count, MTA-STS policy, subdomains from certificate logs'
      required:
      - domain
    AuditSummary:
      type: object
      properties:
        ok:
          type: integer
        info:
          type: integer
        warn:
          type: integer
        bad:
          type: integer
      required:
      - bad
      - info
      - ok
      - warn
    BlockedDomain:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 253
        enabled:
          type: boolean
        created:
          type: string
          format: date-time
          readOnly: true
      required:
      - created
      - id
      - name
    BlockedDomainRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 253
        enabled:
          type: boolean
      required:
      - name
    Bucket:
      type: object
      properties:
        t:
          type: string
          format: date-time
          description: Start of the minute or hour (UTC)
        count:
          type: integer
      required:
      - count
      - t
    BulkActionRequest:
      type: object
      properties:
        ids:
          type: array
          items:
            type: integer
        action:
          $ref: '#/components/schemas/ActionEnum'
      required:
      - action
      - ids
    BulkResult:
      type: object
      properties:
        count:
          type: integer
      required:
      - count
    Cookie:
      type: object
      properties:
        name:
          type: string
        secure:
          type: boolean
        httponly:
          type: boolean
        samesite:
          type: string
          nullable: true
      required:
      - httponly
      - name
      - samesite
      - secure
    Count:
      type: object
      properties:
        name:
          type: string
        count:
          type: integer
      required:
      - count
      - name
    DestinationCountry:
      type: object
      properties:
        country:
          type: string
          description: ISO code; PRIV = internal addresses, ?? = unknown
        queries:
          type: integer
        ips:
          type: integer
        domains:
          type: integer
        top_domains:
          type: array
          items:
            type: string
        asns:
          type: array
          items:
            type: string
        cities:
          type: array
          items:
            type: string
      required:
      - asns
      - cities
      - country
      - domains
      - ips
      - queries
      - top_domains
    DestinationNetwork:
      type: object
      properties:
        asn:
          type: string
        as_name:
          type: string
          nullable: true
        country:
          type: string
        queries:
          type: integer
        ips:
          type: integer
      required:
      - as_name
      - asn
      - country
      - ips
      - queries
    DestinationPoint:
      type: object
      properties:
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double
        city:
          type: string
        country:
          type: string
        queries:
          type: integer
        ips:
          type: integer
        domains:
          type: array
          items:
            type: string
      required:
      - city
      - country
      - domains
      - ips
      - latitude
      - longitude
      - queries
    Destinations:
      type: object
      properties:
        scanned:
          type: integer
          description: Answered queries examined
        ips_total:
          type: integer
        ips_located:
          type: integer
        pending:
          type: integer
          description: 'Addresses still to locate: ask again in a moment'
        countries:
          type: array
          items:
            $ref: '#/components/schemas/DestinationCountry'
        networks:
          type: array
          items:
            $ref: '#/components/schemas/DestinationNetwork'
        points:
          type: array
          items:
            $ref: '#/components/schemas/DestinationPoint'
          description: Map points (needs a local city database)
        geoip:
          $ref: '#/components/schemas/GeoIpStatus'
      required:
      - countries
      - geoip
      - ips_located
      - ips_total
      - networks
      - pending
      - points
      - scanned
    Dmarc:
      type: object
      properties:
        record:
          type: string
        policy:
          type: string
          nullable: true
        subdomain_policy:
          type: string
          nullable: true
        pct:
          type: integer
        rua:
          type: array
          items:
            type: string
        ruf:
          type: array
          items:
            type: string
        adkim:
          type: string
        aspf:
          type: string
      required:
      - adkim
      - aspf
      - pct
      - policy
      - record
      - rua
      - ruf
      - subdomain_policy
    DnsRecords:
      type: object
      properties:
        type:
          type: string
        values:
          type: array
          items:
            type: string
      required:
      - type
      - values
    Dnssec:
      type: object
      properties:
        enabled:
          type: boolean
        algorithms:
          type: array
          items:
            type: string
      required:
      - algorithms
      - enabled
    EncryptedPacket:
      type: object
      properties:
        p:
          type: string
          description: Base64 encrypted packet (see zones/login_crypto.py)
          maxLength: 32768
      required:
      - p
    EncryptedPacketRequest:
      type: object
      properties:
        p:
          type: string
          minLength: 1
          description: Base64 encrypted packet (see zones/login_crypto.py)
          maxLength: 32768
      required:
      - p
    Finding:
      type: object
      properties:
        severity:
          $ref: '#/components/schemas/SeverityEnum'
        category:
          type: string
        title:
          type: string
        detail:
          type: string
        output:
          type: string
          description: Raw data the test was based on (records, headers, ...)
      required:
      - category
      - detail
      - output
      - severity
      - title
    GeoIp:
      type: object
      properties:
        ip:
          type: string
        private:
          type: boolean
          description: 'Not a public address: nothing to locate'
        country:
          type: string
          description: ISO 3166 alpha-2, empty if unknown
        asn:
          type: string
          nullable: true
        as_name:
          type: string
          nullable: true
        prefix:
          type: string
          nullable: true
        city:
          type: string
          nullable: true
        region:
          type: string
          nullable: true
        latitude:
          type: number
          format: double
          nullable: true
        longitude:
          type: number
          format: double
          nullable: true
        source:
          allOf:
          - $ref: '#/components/schemas/SourceEnum'
          description: |-
            Where the location came from

            * `local` - local
            * `cymru` - cymru
            * `none` - none
            * `private` - private
      required:
      - as_name
      - asn
      - city
      - country
      - ip
      - latitude
      - longitude
      - prefix
      - private
      - region
      - source
    GeoIpDb:
      type: object
      properties:
        type:
          type: string
        built:
          type: string
        file:
          type: string
      required:
      - built
      - file
      - type
    GeoIpStatus:
      type: object
      properties:
        city:
          allOf:
          - $ref: '#/components/schemas/GeoIpDb'
          nullable: true
        asn:
          allOf:
          - $ref: '#/components/schemas/GeoIpDb'
          nullable: true
        configured_city:
          type: boolean
          description: GEOIP_CITY_DB is set (it may still be unreadable)
        configured_asn:
          type: boolean
        online_fallback:
          type: boolean
      required:
      - asn
      - city
      - configured_asn
      - configured_city
      - online_fallback
    GeoIpsResult:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/GeoIp'
        pending:
          type: integer
          description: Addresses not located yet (ask again)
      required:
      - pending
      - results
    GroupResolved:
      type: object
      properties:
        name:
          type: string
        resolved:
          type: array
          items:
            $ref: '#/components/schemas/Resolved'
      required:
      - name
      - resolved
    Host:
      type: object
      properties:
        ip:
          type: string
        ptr:
          type: string
          nullable: true
        network:
          type: string
          nullable: true
        org:
          type: string
          nullable: true
        country:
          type: string
          nullable: true
        asn:
          type: string
          nullable: true
        as_name:
          type: string
          nullable: true
        prefix:
          type: string
          nullable: true
        registry:
          type: string
          nullable: true
      required:
      - as_name
      - asn
      - country
      - ip
      - network
      - org
      - prefix
      - ptr
      - registry
    Hsts:
      type: object
      properties:
        max_age:
          type: integer
        include_subdomains:
          type: boolean
        preload:
          type: boolean
      required:
      - include_subdomains
      - max_age
      - preload
    ImportedBlocked:
      type: object
      properties:
        count:
          type: integer
        names:
          type: array
          items:
            type: string
      required:
      - count
      - names
    LoginKey:
      type: object
      properties:
        key:
          type: string
          description: Public key (base64) to encrypt the login packet to; new after
            every server restart
      required:
      - key
    LoginResult:
      type: object
      description: Either token (logged in) or mfa + ticket + methods (a second step
        is needed).
      properties:
        token:
          type: string
        mfa:
          allOf:
          - $ref: '#/components/schemas/MfaEnum'
          description: |-
            verify: prove a factor; setup: enrol the first factor

            * `verify` - verify
            * `setup` - setup
        ticket:
          type: string
          description: Short-lived signed ticket for the next step
        methods:
          type: array
          items:
            $ref: '#/components/schemas/MethodsEnum'
    Mail:
      type: object
      properties:
        mx:
          type: array
          items:
            $ref: '#/components/schemas/Mx'
        spf:
          allOf:
          - $ref: '#/components/schemas/Spf'
          nullable: true
        dmarc:
          allOf:
          - $ref: '#/components/schemas/Dmarc'
          nullable: true
        dkim_selectors:
          type: array
          items:
            type: string
        mta_sts:
          allOf:
          - $ref: '#/components/schemas/MtaSts'
          nullable: true
        tls_rpt:
          type: string
          nullable: true
        bimi:
          type: string
          nullable: true
      required:
      - bimi
      - dkim_selectors
      - dmarc
      - mta_sts
      - mx
      - spf
      - tls_rpt
    Me:
      type: object
      properties:
        username:
          type: string
        is_superuser:
          type: boolean
        default_zone:
          type: string
          description: Name of the zone the GUI opens by default (DEFAULT_ZONE)
      required:
      - default_zone
      - is_superuser
      - username
    MethodsEnum:
      enum:
      - totp
      - passkey
      type: string
      description: |-
        * `totp` - totp
        * `passkey` - passkey
    MfaCodeRequest:
      type: object
      properties:
        ticket:
          type: string
          description: Login ticket; not needed when already logged in
        code:
          type: string
          minLength: 1
          maxLength: 10
      required:
      - code
    MfaCredentialRequest:
      type: object
      properties:
        ticket:
          type: string
          description: Login ticket; not needed when already logged in
        credential:
          description: PublicKeyCredential.toJSON() from the browser
        name:
          type: string
          maxLength: 80
      required:
      - credential
    MfaEnum:
      enum:
      - verify
      - setup
      type: string
      description: |-
        * `verify` - verify
        * `setup` - setup
    MfaOptions:
      type: object
      properties:
        options:
          description: WebAuthn options for PublicKeyCredential.parse*OptionsFromJSON()
      required:
      - options
    MfaStatus:
      type: object
      properties:
        required:
          type: boolean
        totp:
          type: boolean
        passkeys:
          type: array
          items:
            $ref: '#/components/schemas/PasskeyInfo'
      required:
      - passkeys
      - required
      - totp
    MfaTicketRequest:
