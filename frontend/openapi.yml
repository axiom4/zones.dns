openapi: 3.0.3
info:
  title: Zones.dns API
  version: 1.0.0
paths:
  /api/admin-ticket/:
    post:
      operationId: admin_ticket_create
      description: 'One-use ticket (60 s) that opens the Django admin: the GUI posts
        it to /admin/sso/.'
      tags:
      - admin-ticket
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminTicket'
          description: ''
  /api/audit/:
    post:
      operationId: audit_create
      description: Collect public information about a domain and flag common problems.
        Takes ~5-15 s; deep=true adds slower checks (up to ~40 s).
      tags:
      - audit
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuditRequestRequest'
        required: true
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditReport'
          description: ''
  /api/blocked/:
    get:
      operationId: blocked_list
      tags:
      - blocked
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BlockedDomain'
          description: ''
    post:
      operationId: blocked_create
      tags:
      - blocked
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BlockedDomainRequest'
        required: true
      security:
      - tokenAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BlockedDomain'
          description: ''
  /api/blocked/{id}/:
    get:
      operationId: blocked_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this blocked domain.
        required: true
      tags:
      - blocked
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BlockedDomain'
          description: ''
    put:
      operationId: blocked_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this blocked domain.
        required: true
      tags:
      - blocked
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BlockedDomainRequest'
        required: true
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BlockedDomain'
          description: ''
    patch:
      operationId: blocked_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this blocked domain.
        required: true
      tags:
      - blocked
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedBlockedDomainRequest'
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BlockedDomain'
          description: ''
    delete:
      operationId: blocked_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this blocked domain.
        required: true
      tags:
      - blocked
      security:
      - tokenAuth: []
      responses:
        '204':
          description: No response body
  /api/blocked/imported/:
    get:
      operationId: blocked_imported_retrieve
      description: 'Domains imported from public blocklists (read-only, searchable,
        paged: there can be tens of thousands).'
      parameters:
      - in: query
        name: limit
        schema:
          type: integer
      - in: query
        name: offset
        schema:
          type: integer
      - in: query
        name: q
        schema:
          type: string
      tags:
      - blocked
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportedBlocked'
          description: ''
  /api/blocked/personal/:
    get:
      operationId: blocked_personal_retrieve
      description: 'The master switch of the Personal blocks: off = the domains added
        by hand are kept but ignored.'
      tags:
      - blocked
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonalSwitch'
          description: ''
    patch:
      operationId: blocked_personal_partial_update
      description: 'The master switch of the Personal blocks: off = the domains added
        by hand are kept but ignored.'
      tags:
      - blocked
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedPersonalSwitchRequest'
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonalSwitch'
          description: ''
  /api/blocked/public/:
    get:
      operationId: blocked_public_retrieve
      description: 'The master switch of the Public lists: off = the imported domains
        are kept but ignored.'
      tags:
      - blocked
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonalSwitch'
          description: ''
    patch:
      operationId: blocked_public_partial_update
      description: 'The master switch of the Public lists: off = the imported domains
        are kept but ignored.'
      tags:
      - blocked
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedPersonalSwitchRequest'
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonalSwitch'
          description: ''
  /api/geo/destinations/:
    get:
      operationId: geo_destinations_retrieve
      description: Where the answers of the DNS queries point, by country and network.
      parameters:
      - in: query
        name: hours
        schema:
          type: integer
        description: Time window in hours (default 24, max 720)
      tags:
      - geo
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Destinations'
          description: ''
  /api/geo/ips/:
    get:
      operationId: geo_ips_retrieve
      description: Country and network of some addresses (cached; unknown ones are
        looked up).
      parameters:
      - in: query
        name: ips
        schema:
          type: string
        description: Comma separated IP addresses (max 50)
      tags:
      - geo
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeoIpsResult'
          description: ''
  /api/hosts/:
    get:
      operationId: hosts_list
      description: 'Static hosts (like /etc/hosts): a name answered with a fixed address.'
      tags:
      - hosts
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StaticHost'
          description: ''
    post:
      operationId: hosts_create
      description: 'Static hosts (like /etc/hosts): a name answered with a fixed address.'
      tags:
      - hosts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StaticHostRequest'
        required: true
      security:
      - tokenAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaticHost'
          description: ''
  /api/hosts/{id}/:
    get:
      operationId: hosts_retrieve
      description: 'Static hosts (like /etc/hosts): a name answered with a fixed address.'
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this static host.
        required: true
      tags:
      - hosts
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaticHost'
          description: ''
    put:
      operationId: hosts_update
      description: 'Static hosts (like /etc/hosts): a name answered with a fixed address.'
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this static host.
        required: true
      tags:
      - hosts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StaticHostRequest'
        required: true
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaticHost'
          description: ''
    patch:
      operationId: hosts_partial_update
      description: 'Static hosts (like /etc/hosts): a name answered with a fixed address.'
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this static host.
        required: true
      tags:
      - hosts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedStaticHostRequest'
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaticHost'
          description: ''
    delete:
      operationId: hosts_destroy
      description: 'Static hosts (like /etc/hosts): a name answered with a fixed address.'
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this static host.
        required: true
      tags:
      - hosts
      security:
      - tokenAuth: []
      responses:
        '204':
          description: No response body
  /api/login-key/:
    get:
      operationId: login_key_retrieve
      description: Public key for the encrypted login. A new key pair is made at every
        server start.
      tags:
      - login-key
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginKey'
          description: ''
  /api/logs/:
    get:
      operationId: logs_list
      parameters:
      - in: query
        name: answer
        schema:
          type: string
        description: Text contained in the answer records, e.g. an IP address
      - in: query
        name: client
        schema:
          type: string
        description: Exact client IP
      - in: query
        name: domain
        schema:
          type: string
        description: Exact registrable domain, e.g. example.com
      - in: query
        name: hours
        schema:
          type: integer
        description: Only the last N hours
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: name
        schema:
          type: string
        description: Exact name
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      - in: query
        name: outcome
        schema:
          type: string
          enum:
          - blocked
          - error
          - forwarded
          - local
      - in: query
        name: q
        schema:
          type: string
        description: Name contains (case-insensitive)
      - in: query
        name: rcode
        schema:
          type: string
        description: Response code, e.g. NXDOMAIN
      - in: query
        name: type
        schema:
          type: string
        description: Exact query type, e.g. A
      tags:
      - logs
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedQueryLogList'
          description: ''
  /api/logs/{id}/:
    get:
      operationId: logs_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this query log.
        required: true
      tags:
      - logs
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueryLog'
          description: ''
  /api/logs/answers/:
    get:
      operationId: logs_answers_list
      description: Answer records for some queries, loaded on demand.
      parameters:
      - in: query
        name: ids
        schema:
          type: string
        description: Comma separated query ids (max 200)
      tags:
      - logs
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/QueryLogAnswers'
          description: ''
  /api/logs/grouped/:
    get:
      operationId: logs_grouped_list
      description: Same filters as the list, one row per registrable domain (or per
        host name with by=name).
      parameters:
      - in: query
        name: answer
        schema:
          type: string
        description: Text contained in the answer records, e.g. an IP address
      - in: query
        name: by
        schema:
          type: string
          enum:
          - domain
          - name
        description: Group by registrable domain (default) or by full host name
      - in: query
        name: client
        schema:
          type: string
        description: Exact client IP
      - in: query
        name: domain
        schema:
          type: string
        description: Exact registrable domain, e.g. example.com
      - in: query
        name: hours
        schema:
          type: integer
        description: Only the last N hours
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: name
        schema:
          type: string
        description: Exact name
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      - in: query
        name: ordering
        schema:
          type: string
          enum:
          - count
          - last
        description: Most recent (default) or most requested first
      - in: query
        name: outcome
        schema:
          type: string
          enum:
          - blocked
          - error
          - forwarded
          - local
      - in: query
        name: q
        schema:
          type: string
        description: Name contains (case-insensitive)
      - in: query
        name: rcode
        schema:
          type: string
        description: Response code, e.g. NXDOMAIN
      - in: query
        name: type
        schema:
          type: string
        description: Exact query type, e.g. A
      tags:
      - logs
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedQueryLogGroupList'
          description: ''
  /api/logs/purge/:
    post:
      operationId: logs_purge_create
      description: 'Delete old queries (not filtered by the list filters: it ages
        the whole log).'
      tags:
      - logs
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PurgeRequestRequest'
        required: true
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurgeResult'
          description: ''
  /api/logs/resolved/:
    get:
      operationId: logs_resolved_list
      description: Recent distinct answers (A/AAAA/CNAME, at most 4) for some groups,
        loaded on demand.
      parameters:
      - in: query
        name: by
        schema:
          type: string
          enum:
          - domain
          - name
        description: 'What the names are: registrable domains (default) or host names'
      - in: query
        name: names
        schema:
          type: string
        description: Comma separated names (max 50)
      tags:
      - logs
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GroupResolved'
          description: ''
  /api/me/:
    get:
      operationId: me_retrieve
      description: Who is logged in, to show only what they can use.
      tags:
      - me
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
  /api/mfa/:
    get:
      operationId: mfa_retrieve
      description: Second factors of the logged-in user.
      tags:
      - mfa
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MfaStatus'
          description: ''
  /api/mfa/encrypted/:
    post:
      operationId: mfa_encrypted_create
      description: 'Every second-factor step inside the encrypted channel: payload
        {a: step, d: its data}, reply = the step''s body. Nothing readable on the
        wire.'
      tags:
      - mfa
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EncryptedPacketRequest'
        required: true
      security:
      - tokenAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EncryptedPacket'
          description: ''
  /api/mfa/passkey/{id}/remove/:
    delete:
      operationId: mfa_passkey_remove_destroy
      description: Remove a passkey (not if it is the last factor and MFA is required).
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - mfa
      security:
      - tokenAuth: []
      responses:
        '204':
          description: No response body
  /api/mfa/passkey/options/:
    post:
      operationId: mfa_passkey_options_create
      description: 'One step over a plain request. Refused when LOGIN_ENCRYPTION=required:
        use the encrypted endpoint.'
      tags:
      - mfa
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaTicketRequest'
      security:
      - tokenAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MfaOptions'
          description: ''
  /api/mfa/passkey/register/:
    post:
      operationId: mfa_passkey_register_create
      description: 'One step over a plain request. Refused when LOGIN_ENCRYPTION=required:
        use the encrypted endpoint.'
      tags:
      - mfa
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaCredentialRequest'
        required: true
      security:
      - tokenAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResult'
          description: ''
  /api/mfa/passkey/register-options/:
    post:
      operationId: mfa_passkey_register_options_create
      description: 'One step over a plain request. Refused when LOGIN_ENCRYPTION=required:
        use the encrypted endpoint.'
      tags:
      - mfa
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaTicketRequest'
      security:
      - tokenAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MfaOptions'
          description: ''
  /api/mfa/passkey/verify/:
    post:
      operationId: mfa_passkey_verify_create
      description: 'One step over a plain request. Refused when LOGIN_ENCRYPTION=required:
        use the encrypted endpoint.'
      tags:
      - mfa
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaCredentialRequest'
        required: true
      security:
      - tokenAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResult'
          description: ''
  /api/mfa/stepup/passkey/options/:
    post:
      operationId: mfa_stepup_passkey_options_create
      description: 'One step over a plain request. Refused when LOGIN_ENCRYPTION=required:
        use the encrypted endpoint.'
      tags:
      - mfa
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StepUpScopeRequest'
        required: true
      security:
      - tokenAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MfaOptions'
          description: ''
  /api/mfa/stepup/passkey/verify/:
    post:
      operationId: mfa_stepup_passkey_verify_create
      description: 'One step over a plain request. Refused when LOGIN_ENCRYPTION=required:
        use the encrypted endpoint.'
      tags:
      - mfa
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StepUpCredentialRequest'
        required: true
      security:
      - tokenAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StepUpGrant'
          description: ''
  /api/mfa/stepup/totp/:
    post:
      operationId: mfa_stepup_totp_create
      description: 'One step over a plain request. Refused when LOGIN_ENCRYPTION=required:
        use the encrypted endpoint.'
      tags:
      - mfa
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StepUpCodeRequest'
        required: true
      security:
      - tokenAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StepUpGrant'
          description: ''
  /api/mfa/totp/:
    post:
      operationId: mfa_totp_create
      description: 'One step over a plain request. Refused when LOGIN_ENCRYPTION=required:
        use the encrypted endpoint.'
      tags:
      - mfa
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaCodeRequest'
        required: true
      security:
      - tokenAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResult'
          description: ''
  /api/mfa/totp/confirm/:
    post:
      operationId: mfa_totp_confirm_create
      description: 'One step over a plain request. Refused when LOGIN_ENCRYPTION=required:
        use the encrypted endpoint.'
      tags:
      - mfa
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaCodeRequest'
        required: true
      security:
      - tokenAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResult'
          description: ''
  /api/mfa/totp/remove/:
    delete:
      operationId: mfa_totp_remove_destroy
      description: Remove the authenticator app (not if it is the last factor and
        MFA is required).
      tags:
      - mfa
      security:
      - tokenAuth: []
      responses:
        '204':
          description: No response body
  /api/mfa/totp/setup/:
    post:
      operationId: mfa_totp_setup_create
      description: 'One step over a plain request. Refused when LOGIN_ENCRYPTION=required:
        use the encrypted endpoint.'
      tags:
      - mfa
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaTicketRequest'
      security:
      - tokenAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TotpSetup'
          description: ''
  /api/records/:
    get:
      operationId: records_list
      parameters:
      - in: query
        name: zone
        schema:
          type: integer
        description: Filter by zone id
      tags:
      - records
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
